name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller aiohttp pystray Pillow
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: MimoMeter-Windows
          path: dist/MimoMeter.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller aiohttp pystray Pillow
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: MimoMeter-MacOS
          path: dist/MimoMeter.app

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            MimoMeter-Windows/MimoMeter.exe
            MimoMeter-MacOS/MimoMeter.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
