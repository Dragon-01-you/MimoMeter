<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiMo Meter - 本地用量监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 10px; color: #38bdf8; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .card h3 { color: #94a3b8; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
        .card .value { font-size: 32px; font-weight: bold; color: #38bdf8; }
        .card .sub { font-size: 12px; color: #64748b; margin-top: 5px; }
        .chart-container { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
        .status { text-align: center; padding: 10px; background: #1e293b; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        .status span { color: #4ade80; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 600; }
        .refresh { position: fixed; top: 20px; right: 20px; background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .refresh:hover { background: #7dd3fc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ MiMo Meter</h1>
        <p class="subtitle">本地 API 用量监控仪表盘 | 数据仅存储在本机</p>

        <div class="status">
            代理状态: <span>● 运行中</span> | 监听地址: <code>http://127.0.0.1:8080</code> |
            数据文件: <code>~/.mimo-meter/usage.db</code>
        </div>

        <div class="grid">
            <div class="card">
                <h3>今日 Token 消耗</h3>
                <div class="value" id="today-total">0</div>
                <div class="sub">Input: <span id="today-input">0</span> | Output: <span id="today-output">0</span></div>
            </div>
            <div class="card">
                <h3>累计 Token 消耗</h3>
                <div class="value" id="total-total">0</div>
                <div class="sub">总调用次数: <span id="total-calls">0</span></div>
            </div>
            <div class="card">
                <h3>平均每次调用</h3>
                <div class="value" id="avg-tokens">0</div>
                <div class="sub">基于全部历史数据</div>
            </div>
        </div>

        <div class="chart-container">
            <h3 style="margin-bottom: 15px;">📈 近 7 天用量趋势</h3>
            <canvas id="trendChart"></canvas>
        </div>

        <div class="chart-container">
            <h3 style="margin-bottom: 15px;">🤖 按模型分布</h3>
            <table>
                <thead><tr><th>模型</th><th>总 Token</th><th>调用次数</th></tr></thead>
                <tbody id="model-table"></tbody>
            </table>
        </div>

        <div class="chart-container">
            <h3 style="margin-bottom: 15px;">📋 最近调用记录</h3>
            <table>
                <thead><tr><th>时间</th><th>模型</th><th>Input</th><th>Output</th><th>Total</th></tr></thead>
                <tbody id="recent-table"></tbody>
            </table>
        </div>

        <div class="chart-container">
            <h3 style="margin-bottom: 15px;">📤 导出数据</h3>
            <div style="display: flex; gap: 10px;">
                <a href="/api/export/csv" download="mimo-meter-export.csv" style="background: #38bdf8; color: #0f172a; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">导出 CSV</a>
                <a href="/api/export/json" download="mimo-meter-export.json" style="background: #4ade80; color: #0f172a; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">导出 JSON</a>
            </div>
        </div>
    </div>

    <button class="refresh" onclick="loadData()">🔄 刷新数据</button>

    <script>
        let trendChart;

        async function loadData() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                // 今日数据
                document.getElementById('today-total').textContent = data.today.total.toLocaleString();
                document.getElementById('today-input').textContent = data.today.prompt.toLocaleString();
                document.getElementById('today-output').textContent = data.today.completion.toLocaleString();

                // 累计数据
                document.getElementById('total-total').textContent = data.total.total.toLocaleString();
                document.getElementById('total-calls').textContent = data.total.calls.toLocaleString();

                // 平均
                const avg = data.total.calls > 0 ? Math.round(data.total.total / data.total.calls) : 0;
                document.getElementById('avg-tokens').textContent = avg.toLocaleString();

                // 模型表格
                const tbody = document.getElementById('model-table');
                tbody.innerHTML = data.by_model.map(m => `
                    <tr><td>${m.model}</td><td>${m.tokens.toLocaleString()}</td><td>${m.calls}</td></tr>
                `).join('');

                // 最近调用记录
                const recentTbody = document.getElementById('recent-table');
                recentTbody.innerHTML = data.recent.map(r => `
                    <tr>
                        <td>${new Date(r.timestamp).toLocaleString()}</td>
                        <td>${r.model}</td>
                        <td>${r.prompt.toLocaleString()}</td>
                        <td>${r.completion.toLocaleString()}</td>
                        <td>${r.total.toLocaleString()}</td>
                    </tr>
                `).join('');

                // 趋势图
                const ctx = document.getElementById('trendChart').getContext('2d');
                if (trendChart) trendChart.destroy();
                trendChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.trend.map(t => t.date.slice(5)),
                        datasets: [{
                            label: 'Token 用量',
                            data: data.trend.map(t => t.tokens),
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56, 189, 248, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                        }
                    }
                });
            } catch (e) {
                console.error('加载失败:', e);
            }
        }

        loadData();
        setInterval(loadData, 5000); // 每 5 秒自动刷新
    </script>
</body>
</html>
