<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiMo Meter - 本地用量监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --bg-card: #141414;
            --border-color: #222222;
            --text-primary: #f5f5f5;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent-blue: #00a8ff;
            --accent-green: #00ff88;
            --accent-purple: #8b5cf6;
            --accent-orange: #ff6b35;
            --accent-red: #ff4444;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 杂志风头部 */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 24px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 主内容区 */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        /* 杂志风统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 48px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
        }

        .stat-card.green::before {
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
        }

        .stat-card.orange::before {
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-red));
        }

        .stat-card.purple::before {
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
        }

        .stat-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .stat-detail {
            font-size: 13px;
            color: var(--text-muted);
        }

        .stat-detail span {
            color: var(--text-secondary);
        }

        /* 杂志风图表区域 */
        .charts-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 48px;
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chart-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 杂志风表格 */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
        }

        tbody td {
            padding: 16px;
            font-size: 14px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
        }

        tbody tr:hover {
            background: var(--bg-tertiary);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .model-badge {
            display: inline-block;
            padding: 4px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .token-value {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .token-input { color: var(--accent-blue); }
        .token-output { color: var(--accent-green); }
        .token-total { color: var(--text-primary); }

        /* 导出按钮 */
        .export-section {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .export-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .export-btn:hover {
            background: var(--bg-card);
            border-color: var(--accent-blue);
        }

        .export-btn.primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #000;
        }

        .export-btn.primary:hover {
            background: #0090e0;
        }

        /* 底部信息 */
        .footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header-content {
                padding: 0 20px;
                flex-direction: column;
                gap: 16px;
            }
            .main {
                padding: 20px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .stat-value {
                font-size: 32px;
            }
        }

        /* 加载动画 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <div class="logo-text">
                    <h1>MiMo Meter</h1>
                    <p>本地用量监控</p>
                </div>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>代理运行中</span>
                <code style="margin-left: 8px; color: var(--text-secondary);">127.0.0.1:8080</code>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="main">
        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">今日消耗</div>
                <div class="stat-value" id="today-total">0</div>
                <div class="stat-detail">
                    Input: <span id="today-input" class="token-input">0</span>
                    &nbsp;·&nbsp;
                    Output: <span id="today-output" class="token-output">0</span>
                </div>
            </div>
            <div class="stat-card green">
                <div class="stat-label">累计消耗</div>
                <div class="stat-value" id="total-total">0</div>
                <div class="stat-detail">总调用: <span id="total-calls">0</span> 次</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-label">平均消耗</div>
                <div class="stat-value" id="avg-tokens">0</div>
                <div class="stat-detail">每次调用平均</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-label">活跃模型</div>
                <div class="stat-value" id="model-count">0</div>
                <div class="stat-detail">个不同模型</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-section">
            <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">用量趋势</div>
                        <div class="chart-subtitle">最近 7 天 Token 消耗</div>
                    </div>
                </div>
                <canvas id="trendChart" height="300"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">模型分布</div>
                        <div class="chart-subtitle">按模型统计</div>
                    </div>
                </div>
                <canvas id="modelChart" height="300"></canvas>
            </div>
        </div>

        <!-- 最近调用记录 -->
        <div class="table-card">
            <div class="table-header">
                <div class="table-title">最近调用记录</div>
                <div class="export-section">
                    <a href="/api/export/csv" download="mimo-meter-export.csv" class="export-btn">
                        📥 导出 CSV
                    </a>
                    <a href="/api/export/json" download="mimo-meter-export.json" class="export-btn primary">
                        📥 导出 JSON
                    </a>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>模型</th>
                        <th>Input</th>
                        <th>Output</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="recent-table">
                    <tr>
                        <td colspan="5">
                            <div class="loading">加载中</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- 底部 -->
    <footer class="footer">
        <p>MiMo Meter · 本地 API 用量监控 · 数据仅存储在本机</p>
        <p style="margin-top: 8px;">
            <a href="https://github.com/Dragon-01-you/MimoMeter" target="_blank">GitHub</a>
            &nbsp;·&nbsp;
            <span>v1.0.0</span>
        </p>
    </footer>

    <script>
        let trendChart, modelChart;

        // 格式化数字
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toLocaleString();
        }

        // 加载数据
        async function loadData() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                // 更新统计卡片
                document.getElementById('today-total').textContent = formatNumber(data.today.total);
                document.getElementById('today-input').textContent = formatNumber(data.today.prompt);
                document.getElementById('today-output').textContent = formatNumber(data.today.completion);

                document.getElementById('total-total').textContent = formatNumber(data.total.total);
                document.getElementById('total-calls').textContent = data.total.calls.toLocaleString();

                const avg = data.total.calls > 0 ? Math.round(data.total.total / data.total.calls) : 0;
                document.getElementById('avg-tokens').textContent = formatNumber(avg);

                document.getElementById('model-count').textContent = data.by_model.length;

                // 更新趋势图
                const trendCtx = document.getElementById('trendChart').getContext('2d');
                if (trendChart) trendChart.destroy();
                trendChart = new Chart(trendCtx, {
                    type: 'line',
                    data: {
                        labels: data.trend.map(t => t.date.slice(5)),
                        datasets: [{
                            label: 'Token 用量',
                            data: data.trend.map(t => t.tokens),
                            borderColor: '#00a8ff',
                            backgroundColor: 'rgba(0, 168, 255, 0.1)',
                            fill: true,
                            tension: 0.4,
                            borderWidth: 2,
                            pointRadius: 4,
                            pointBackgroundColor: '#00a8ff',
                            pointBorderColor: '#0a0a0a',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#1a1a1a',
                                titleColor: '#f5f5f5',
                                bodyColor: '#f5f5f5',
                                borderColor: '#333',
                                borderWidth: 1,
                                padding: 12,
                                displayColors: false,
                                callbacks: {
                                    label: function(context) {
                                        return formatNumber(context.parsed.y) + ' tokens';
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                grid: { color: '#1a1a1a' },
                                ticks: {
                                    color: '#555',
                                    callback: function(value) {
                                        return formatNumber(value);
                                    }
                                }
                            },
                            x: {
                                grid: { color: '#1a1a1a' },
                                ticks: { color: '#555' }
                            }
                        }
                    }
                });

                // 更新模型分布图
                const modelCtx = document.getElementById('modelChart').getContext('2d');
                if (modelChart) modelChart.destroy();

                const colors = ['#00a8ff', '#00ff88', '#8b5cf6', '#ff6b35', '#ff4444'];
                modelChart = new Chart(modelCtx, {
                    type: 'doughnut',
                    data: {
                        labels: data.by_model.map(m => m.model),
                        datasets: [{
                            data: data.by_model.map(m => m.tokens),
                            backgroundColor: colors.slice(0, data.by_model.length),
                            borderColor: '#141414',
                            borderWidth: 3,
                            hoverOffset: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '65%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    color: '#888',
                                    padding: 16,
                                    usePointStyle: true,
                                    pointStyleWidth: 10,
                                    font: { size: 12 }
                                }
                            },
                            tooltip: {
                                backgroundColor: '#1a1a1a',
                                titleColor: '#f5f5f5',
                                bodyColor: '#f5f5f5',
                                borderColor: '#333',
                                borderWidth: 1,
                                padding: 12,
                                callbacks: {
                                    label: function(context) {
                                        return context.label + ': ' + formatNumber(context.parsed) + ' tokens';
                                    }
                                }
                            }
                        }
                    }
                });

                // 更新最近调用记录
                const recentTbody = document.getElementById('recent-table');
                if (data.recent.length === 0) {
                    recentTbody.innerHTML = `
                        <tr>
                            <td colspan="5">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📭</div>
                                    <div class="empty-state-text">暂无调用记录</div>
                                </div>
                            </td>
                        </tr>
                    `;
                } else {
                    recentTbody.innerHTML = data.recent.map(r => `
                        <tr>
                            <td>${new Date(r.timestamp).toLocaleString('zh-CN', {
                                month: '2-digit',
                                day: '2-digit',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit'
                            })}</td>
                            <td><span class="model-badge">${r.model}</span></td>
                            <td class="token-value token-input">${formatNumber(r.prompt)}</td>
                            <td class="token-value token-output">${formatNumber(r.completion)}</td>
                            <td class="token-value token-total">${formatNumber(r.total)}</td>
                        </tr>
                    `).join('');
                }

            } catch (e) {
                console.error('加载失败:', e);
            }
        }

        // 初始加载
        loadData();

        // 每 5 秒自动刷新
        setInterval(loadData, 5000);
    </script>
</body>
</html>
